<head>

  <meta name="description" content="Ceramic objects, sculptures, and studies.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400;0,500;1,400&family=Newsreader:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css?v=22">
</head>
<body>

  <a href="#main" class="skip-link">Skip to content</a>

  <header class="site-header">
    <a href="/" class="site-title">danyang</a>
    <nav class="site-nav" aria-label="Main navigation">
      <a href="/rock/" class="nav-link">Rock</a>
      <a href="/clay/" class="nav-link nav-link--active" aria-current="page">Clay</a>
      <a href="/moving/" class="nav-link">Moving</a>
      <a href="/collected/" class="nav-link">Collected</a>
      <a href="/new-york-and-around/" class="nav-link">New York and Around</a>
      <a href="/about/" class="nav-link">About</a>
    </nav>
  </header>

  <canvas class="clay-trace" data-clay-trace aria-hidden="true"></canvas>

  <main id="main" class="pottery-page">

    <div class="section-header pottery-heading">
      <h1>Clay</h1>
    </div>

    <div class="pottery-field" aria-label="Ceramic works">
      <article class="pottery-piece pottery-piece--01">
        <button class="pottery-object" type="button" data-title="Dark Bowl I" data-meta="2024 · Stoneware, reduction glaze" aria-label="View Dark Bowl I">
          <span class="pottery-photograph"><img src="/assets/images/ceramics/isolated/clay-01.webp" alt="Dark glazed ceramic bowl with pale flowing glaze" width="482" height="389" loading="eager" fetchpriority="high"></span>
          <span class="pottery-caption"><span>Dark Bowl I</span><small>2024</small></span>
        </button>
      </article>

      <article class="pottery-piece pottery-piece--02">
        <button class="pottery-object" type="button" data-title="Footed Vessel" data-meta="2024 · Coarse stoneware, iron slip" aria-label="View Footed Vessel">
          <span class="pottery-photograph"><img src="/assets/images/ceramics/isolated/clay-02.webp" alt="Rounded ceramic vessel with black and pale blue-green glaze" width="649" height="512" loading="eager"></span>
          <span class="pottery-caption"><span>Footed Vessel</span><small>2024</small></span>
        </button>
      </article>

      <article class="pottery-piece pottery-piece--03">
        <button class="pottery-object" type="button" data-title="Ash Glaze Bowl" data-meta="2024 · Stoneware, natural ash glaze" aria-label="View Ash Glaze Bowl">
          <span class="pottery-photograph"><img src="/assets/images/ceramics/isolated/clay-03.webp" alt="Underside of a circular ceramic bowl with an impressed maker's mark" width="623" height="648" loading="lazy" decoding="async"></span>
          <span class="pottery-caption"><span>Ash Glaze Bowl</span><small>2024</small></span>
        </button>
      </article>

      <article class="pottery-piece pottery-piece--04">
        <button class="pottery-object" type="button" data-title="Cup with Crystalline Rim" data-meta="2024 · Dark clay body, reduction" aria-label="View Cup with Crystalline Rim">
          <span class="pottery-photograph"><img src="/assets/images/ceramics/isolated/clay-04.webp" alt="Interior of a dark circular bowl with metallic glaze pooling" width="708" height="701" loading="lazy" decoding="async"></span>
          <span class="pottery-caption"><span>Cup with Crystalline Rim</span><small>2024</small></span>
        </button>
      </article>

      <article class="pottery-piece pottery-piece--05">
        <button class="pottery-object" type="button" data-title="Glaze Study (Interior)" data-meta="2024 · Stoneware, ash and feldspar" aria-label="View Glaze Study, Interior">
          <span class="pottery-photograph"><img src="/assets/images/ceramics/isolated/clay-05.webp" alt="Low sculptural ceramic form with dark metallic glaze" width="1062" height="711" loading="lazy" decoding="async"></span>
          <span class="pottery-caption"><span>Glaze Study (Interior)</span><small>2024</small></span>
        </button>
      </article>

      <article class="pottery-piece pottery-piece--06">
        <button class="pottery-object" type="button" data-title="Pinch Vessel" data-meta="2024 · Hand-pinched stoneware" aria-label="View Pinch Vessel">
          <span class="pottery-photograph"><img src="/assets/images/ceramics/isolated/clay-06.webp" alt="Open irregular vessel with a dark folded rim" width="986" height="646" loading="lazy" decoding="async"></span>
          <span class="pottery-caption"><span>Pinch Vessel</span><small>2024</small></span>
        </button>
      </article>

      <article class="pottery-piece pottery-piece--07">
        <button class="pottery-object" type="button" data-title="Form Study II" data-meta="2024 · Coarse stoneware" aria-label="View Form Study II">
          <span class="pottery-photograph"><img src="/assets/images/ceramics/isolated/clay-07.webp" alt="Dark open ceramic form with an irregular folded outline" width="938" height="609" loading="lazy" decoding="async"></span>
          <span class="pottery-caption"><span>Form Study II</span><small>2024</small></span>
        </button>
      </article>

      <article class="pottery-piece pottery-piece--08">
        <button class="pottery-object" type="button" data-title="Flared Bowl" data-meta="2024 · Stoneware, mottled slip" aria-label="View Flared Bowl">
          <span class="pottery-photograph"><img src="/assets/images/ceramics/isolated/clay-08.webp" alt="Angular dark ceramic form with exposed pale clay along its base" width="990" height="618" loading="lazy" decoding="async"></span>
          <span class="pottery-caption"><span>Flared Bowl</span><small>2024</small></span>
        </button>
      </article>

      <article class="pottery-piece pottery-piece--09">
        <button class="pottery-object" type="button" data-title="Thrown Cup (Profile)" data-meta="2024 · Wheel-thrown stoneware" aria-label="View Thrown Cup, Profile">
          <span class="pottery-photograph"><img src="/assets/images/ceramics/isolated/clay-09.webp" alt="Upright asymmetric ceramic vessel with a glossy dark glaze" width="1098" height="1031" loading="lazy" decoding="async"></span>
          <span class="pottery-caption"><span>Thrown Cup (Profile)</span><small>2024</small></span>
        </button>
      </article>

      <article class="pottery-piece pottery-piece--10">
        <button class="pottery-object" type="button" data-title="Vessel with Glaze Break" data-meta="2024 · Stoneware, feldspathic glaze" aria-label="View Vessel with Glaze Break">
          <span class="pottery-photograph"><img src="/assets/images/ceramics/isolated/clay-10.webp" alt="Tall angular ceramic form with deep brown and black glaze" width="787" height="928" loading="lazy" decoding="async"></span>
          <span class="pottery-caption"><span>Vessel with Glaze Break</span><small>2024</small></span>
        </button>
      </article>

      <article class="pottery-piece pottery-piece--11">
        <button class="pottery-object" type="button" data-title="Thumbed Vessel" data-meta="2024 · Hand-modeled stoneware" aria-label="View Thumbed Vessel">
          <span class="pottery-photograph"><img src="/assets/images/ceramics/isolated/clay-11.webp" alt="Underside of a low sculptural vessel with carved pale clay" width="1000" height="469" loading="lazy" decoding="async"></span>
          <span class="pottery-caption"><span>Thumbed Vessel</span><small>2024</small></span>
        </button>
      </article>

      <article class="pottery-piece pottery-piece--12">
        <button class="pottery-object" type="button" data-title="Small Cup" data-meta="2024 · Stoneware" aria-label="View Small Cup">
          <span class="pottery-photograph"><img src="/assets/images/ceramics/isolated/clay-12.webp" alt="Low folded sculptural ceramic form with a deep red glaze" width="960" height="663" loading="lazy" decoding="async"></span>
          <span class="pottery-caption"><span>Small Cup</span><small>2024</small></span>
        </button>
      </article>
    </div>

  </main>

  <dialog class="pottery-lightbox" data-pottery-dialog aria-label="Ceramic detail">
    <button class="pottery-lightbox__close" type="button" data-pottery-close aria-label="Close ceramic detail">close</button>
    <figure class="pottery-lightbox__figure">
      <img data-pottery-dialog-image src="/assets/images/ceramics/isolated/clay-01.webp" alt="">
      <figcaption>
        <h2 data-pottery-dialog-title></h2>
        <p data-pottery-dialog-meta></p>
      </figcaption>
    </figure>
  </dialog>

  <footer class="site-footer">
    <div class="footer-inner">
      <span class="footer-name">danyang</span>
      <nav class="footer-links" aria-label="Footer navigation">

        <a href="https://instagram.com/" target="_blank" rel="noopener noreferrer">Instagram</a>
      </nav>
    </div>
