<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Danyang Wu</title>
  <meta name="description" content="Visual archive — photography, ceramics, video, and collected observations.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <a href="#main" class="skip-link">Skip to content</a>

  <header class="site-header">
    <a href="/" class="site-title">Danyang Wu</a>
    <nav class="site-nav" aria-label="Main navigation">
      <a href="/rock/" class="nav-link">Rock</a>
      <a href="/clay/" class="nav-link">Clay</a>
      <a href="/moving/" class="nav-link">Moving</a>
      <a href="/collected/" class="nav-link">Collected</a>
      <a href="/about/" class="nav-link">About</a>
    </nav>
  </header>

  <main id="main">
    <div class="home-stream">

      <!-- FEATURED ITEM 1 — Large photograph -->
      <div class="home-item home-item--large home-item--center">
        <a href="/rock/rock-temporarily/">
          <!-- REPLACE: src with your photograph -->
          <img
            src="/assets/images/placeholder-landscape.svg"
            alt="[Replace: describe the photograph — e.g., Granite face with rope line, evening light]"
            width="1200" height="800"
            loading="eager"
            fetchpriority="high"
          >
          <span class="item-label">Rock</span>
        </a>
      </div>

      <!-- FEATURED ITEM 2 — Small ceramic, offset left -->
      <div class="home-item home-item--small home-item--left">
        <a href="/clay/">
          <!-- REPLACE: src with a ceramic photograph -->
          <img
            src="/assets/images/placeholder-square.svg"
            alt="[Replace: describe the ceramic piece]"
            width="800" height="800"
            loading="lazy"
          >
          <span class="item-label">Clay</span>
        </a>
      </div>

      <!-- FEATURED ITEM 3 — Medium video, offset right -->
      <div class="home-item home-item--medium home-item--right home-video">
        <a href="/moving/">
          <!--
            REPLACE: update poster and source with your video.
            This single homepage video autoplays muted.
            The <img> below is a fallback for prefers-reduced-motion.
          -->
          <video
            autoplay muted loop playsinline
            preload="metadata"
            poster="/assets/images/placeholder-video.svg"
            width="1280" height="720"
            aria-label="[Replace: describe the video — e.g., Water moving over rock]"
          >
            <!-- <source src="/assets/videos/your-video.mp4" type="video/mp4"> -->
          </video>
          <img
            class="video-poster-fallback"
            src="/assets/images/placeholder-video.svg"
            alt="[Replace: describe the video]"
            width="1280" height="720"
            loading="lazy"
          >
          <span class="item-label">Moving</span>
        </a>
      </div>

      <!-- FEATURED ITEM 4 — Another photograph, large -->
      <div class="home-item home-item--large home-item--center">
        <a href="/rock/rock-temporarily/">
          <!-- REPLACE: src with your photograph -->
          <img
            src="/assets/images/placeholder-landscape.svg"
            alt="[Replace: describe the photograph]"
            width="1200" height="800"
            loading="lazy"
          >
          <span class="item-label">Rock</span>
        </a>
      </div>

      <!-- FEATURED ITEM 5 — Portrait photograph, offset right -->
      <div class="home-item home-item--medium home-item--right">
        <a href="/rock/">
          <!-- REPLACE: src with a vertical/portrait photograph -->
          <img
            src="/assets/images/placeholder-portrait.svg"
            alt="[Replace: describe the photograph]"
            width="800" height="1200"
            loading="lazy"
          >
          <span class="item-label">Rock</span>
        </a>
      </div>

      <!-- FEATURED ITEM 6 — Small fruit, offset left -->
      <div class="home-item home-item--small home-item--left">
        <a href="/collected/">
          <!-- REPLACE: src with a fruit photograph -->
          <img
            src="/assets/images/placeholder-square.svg"
            alt="[Replace: describe the fruit — e.g., Mangosteen cut open on a blue plate]"
            width="800" height="800"
            loading="lazy"
          >
          <span class="item-label">Collected</span>
        </a>
      </div>

    </div>
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <span class="footer-name">Danyang Wu</span>
      <nav class="footer-links" aria-label="Footer navigation">
        <!-- REPLACE: update with your actual email and Instagram -->
        <a href="mailto:hello@danyanghere.com">Email</a>
        <a href="https://instagram.com/" target="_blank" rel="noopener noreferrer">Instagram</a>
      </nav>
    </div>
  </footer>

</body>
</html>
