<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rock, Temporarily — Danyang</title>
  <meta name="description" content="When does rock become a route—and for how long?">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <a href="#main" class="skip-link">Skip to content</a>

  <header class="site-header">
    <a href="/" class="site-title">Danyang</a>
    <nav class="site-nav" aria-label="Main navigation">
      <a href="/rock/" class="nav-link nav-link--active">Rock</a>
      <a href="/clay/" class="nav-link">Clay</a>
      <a href="/moving/" class="nav-link">Moving</a>
      <a href="/collected/" class="nav-link">Collected</a>
      <a href="/about/" class="nav-link">About</a>
    </nav>
  </header>

  <main id="main">

    <!-- Project header -->
    <div class="project-hero">
      <h1>Rock, Temporarily</h1>
      <p class="project-year">2024–ongoing</p>
    </div>

    <!-- Opening image — full width -->
    <div class="project-gallery">

      <figure class="gallery-item gallery-item--full">
        <img
          src="/assets/images/photography/rock-temp-01.jpg"
          alt="Pink climbing rope knotted against a massive granite face in dappled light"
          width="1800" height="1350"
          loading="eager"
          fetchpriority="high"
        >
      </figure>

      <!-- Project statement -->
      <div class="project-statement">
        <p class="text-statement">When does rock become a route—and for how long?</p>
      </div>

      <!-- Image 2 — centered -->
      <figure class="gallery-item gallery-item--center">
        <img
          src="/assets/images/photography/rock-temp-02.jpg"
          alt="Spring-loaded camming device seated deep within a granite split with sling and carabiner"
          width="1800" height="1350"
          loading="lazy"
        >
        <figcaption>Cam placement in granite crack</figcaption>
      </figure>

      <!-- Images 3 & 4 — pair -->
      <div class="gallery-pair">
        <figure class="gallery-item">
          <img
            src="/assets/images/photography/rock-temp-03.jpg"
            alt="Trad gear placement inside rock fissure"
            width="1800" height="1350"
            loading="lazy"
          >
          <figcaption>Temporary protection</figcaption>
        </figure>
        <figure class="gallery-item">
          <img
            src="/assets/images/photography/rock-temp-04.jpg"
            alt="Climber reaching hand into steep roof crack in dark shadow"
            width="1800" height="1350"
            loading="lazy"
          >
          <figcaption>Hold contact, roof</figcaption>
        </figure>
      </div>

      <!-- Image 5 — offset left -->
      <figure class="gallery-item gallery-item--left">
        <img
          src="/assets/images/photography/rock-temp-05.jpg"
          alt="Mossy boulder blanketed with early winter snow"
          width="1800" height="1350"
          loading="lazy"
        >
        <figcaption>Boulders and snow</figcaption>
      </figure>

      <!-- Image 6 — offset right -->
      <figure class="gallery-item gallery-item--right">
        <img
          src="/assets/images/photography/rock-temp-06.jpg"
          alt="Climber below rock wall looking up along orange rope line"
          width="1800" height="1350"
          loading="lazy"
        >
        <figcaption>Looking up the line</figcaption>
      </figure>

      <!-- Image 7 — full width -->
      <figure class="gallery-item gallery-item--full">
        <img
          src="/assets/images/photography/rock-temp-07.jpg"
          alt="Sunlight illuminating textured granite through a natural aperture"
          width="1800" height="1350"
          loading="lazy"
        >
        <figcaption>Aperture and shadow</figcaption>
      </figure>

      <!-- Images 8 & 9 — pair -->
      <div class="gallery-pair">
        <figure class="gallery-item">
          <img
            src="/assets/images/photography/rock-temp-08.jpg"
            alt="Climber in winter landscape disappearing into snowy forest path"
            width="1800" height="1350"
            loading="lazy"
          >
          <figcaption>Approach, winter</figcaption>
        </figure>
        <figure class="gallery-item">
          <img
            src="/assets/images/photography/rock-temp-09.jpg"
            alt="Snowfall through dense pine forest"
            width="1800" height="1350"
            loading="lazy"
          >
          <figcaption>Precipitation</figcaption>
        </figure>
      </div>

      <!-- Image 10 — small centered -->
      <figure class="gallery-item gallery-item--small">
        <img
          src="/assets/images/photography/rock-temp-10.jpg"
          alt="Direct sunlight filtering through green forest canopy"
          width="1800" height="1350"
          loading="lazy"
        >
        <figcaption>Canopy light</figcaption>
      </figure>

      <!-- Image 11 — centered -->
      <figure class="gallery-item gallery-item--center">
        <img
          src="/assets/images/photography/rock-temp-11.jpg"
          alt="Horizontal rope rigging cutting across dark woodland trunks"
          width="1800" height="1350"
          loading="lazy"
        >
        <figcaption>Rigging line</figcaption>
      </figure>

      <!-- Image 12 — full width closing -->
      <figure class="gallery-item gallery-item--full">
        <img
          src="/assets/images/photography/rock-temp-12.jpg"
          alt="Sandstone pocket and geological stratification"
          width="1800" height="1350"
          loading="lazy"
        >
        <figcaption>Sedimentary surface and pocket</figcaption>
      </figure>

      <!--

          <figcaption>Location · Year</figcaption>
        </figure>
      -->

    </div>

  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <span class="footer-name">Danyang</span>
      <nav class="footer-links" aria-label="Footer navigation">
        <a href="mailto:hello@danyanghere.com">Email</a>
        <a href="https://instagram.com/" target="_blank" rel="noopener noreferrer">Instagram</a>
      </nav>
    </div>
  </footer>

</body>
</html>
